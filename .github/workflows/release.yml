name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment, which only accepts
    # runs for tags matching v*.
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./tools/licenses -check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign checksums and publish
        env:
          HUSH_RELEASE_KEY: ${{ secrets.HUSH_RELEASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./tools/releasesign dist/checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sig
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
