version: 2
project_name: hush

builds:
  - main: .
    binary: hush
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: docs/THIRD_PARTY_LICENSES.txt
        strip_parent: true

checksum:
  name_template: checksums.txt

# Published by the release workflow once checksums.txt is signed, so that
# "hush update" never sees a release without its signature.
release:
  draft: true
  # A re-run must not leave a second draft whose checksums differ from the
  # ones the sign job signs.
  replace_existing_draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
